# Gradle build settings
# Increase this if you add large dependencies.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=true

# Fabric properties
# Check the latest versions for your Minecraft version at https://fabricmc.net/develop
minecraft_version=1.21
loader_version=0.19.5
loom_version=1.19.3
fabric_api_version=0.102.0+1.21
java_version=21

# Mod properties
# archives_base_name, maven_group and mod_version control the artifact identity.
maven_group=com.example
archives_base_name=examplemod
mod_version=1.0.0
